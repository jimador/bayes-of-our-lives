spring.main.web-application-type=servlet
server.address=127.0.0.1
server.port=8080
spring.main.banner-mode=off
logging.level.root=ERROR
embabel.agent.platform.models.openai.api-key=${OPENAI_API_KEY:}
embabel.agent.platform.decisions.llm.services.openaiDecision.llm=gpt-4.1
embabel.agent.platform.models.typesafe.api-key=${TYPESAFE_API_KEY:}
embabel.agent.platform.models.typesafe.services.jevDecision.model=jev-latest
# Each outing's engine is a role. The same service answers its decision spec and its readiness classification.
embabel.models.decision.roles.local=localDecision
embabel.models.decision.roles.jev=jevDecision
embabel.models.decision.roles.openai=openaiDecision
embabel.models.classification.roles.local=localDecision
embabel.models.classification.roles.jev=jevDecision
embabel.models.classification.roles.openai=openaiDecision
bayes.models.researcher=${BAYES_RESEARCHER_MODEL:gpt-4.1}
bayes.models.planner=${BAYES_PLANNER_MODEL:gpt-4.1}
logging.level.dev.jimador.bayes=${BAYES_LOG_LEVEL:INFO}
