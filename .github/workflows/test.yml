name: Test
on:
  push:
  pull_request:
jobs:
  bays-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package without API keys
        run: mvn -B test package
      - name: Test CLEF bridge without model weights
        run: python3 -m unittest discover -s clef -p 'test_*.py' -v
