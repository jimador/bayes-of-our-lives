name: Test
on:
  push:
  pull_request:
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test without API keys
        run: mvn -B test
  tripper-example:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/tripper-decision-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: examples/tripper-decision-demo/pom.xml
      - name: Test and package without API keys
        run: mvn -B test package
